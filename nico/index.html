function sync(){ $('angle').value=angle;$('angleVal').textContent=Math.round(angle)+'°';$('dist').value=dist;$('distVal').textContent=dist.toFixed(1)+' m';$('eye').value=eye;$('eyeVal').textContent=eye.toFixed(1)+' m';$('speed').value=speed;$('speedVal').textContent=speed.toFixed(1)+'×';$('play').textContent=playing?'暫停':'播放';$('play').classList.toggle('active',playing);$('orbit').classList.toggle('active',orbit);$('static').classList.toggle('active',staticMode);$('static').textContent=staticMode?'切回揮手':'原始去背照';$('glow').classList.toggle('active',glow);$('showMirror').classList.toggle('active',mirror);$('mirrorBox').hidden=!mirror;$('frameLabel').textContent=staticMode?'原始靜態去背照':'18 幀 · 15 fps';}
for(let [id,set] of [['angle',v=>{angle=v;orbit=false}],['dist',v=>dist=v],['eye',v=>eye=v],['speed',v=>speed=v]])$(id).oninput=e=>{set(Number(e.target.value));sync()};$('play').onclick=()=>{playing=!playing;sync()};$('orbit').onclick=()=>{orbit=!orbit;sync()};$('static').onclick=()=>{staticMode=!staticMode;sync()};$('glow').onclick=()=>{glow=!glow;sync()};$('showMirror').onclick=()=>{mirror=!mirror;sync()};$('reset').onclick=()=>{angle=0;dist=5.5;eye=2.1;speed=1;orbit=false;sync()};$('fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})};
$('scene').addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX,a:angle};orbit=false;$('scene').setPointerCapture(e.pointerId);sync()});$('scene').addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;angle=((drag.a+(e.clientX-drag.x)*.38+540)%360)-180;sync()});for(let ev of ['pointerup','pointercancel','lostpointercapture'])$('scene').addEventListener(ev,e=>{if(drag?.id===e.pointerId)drag=null});$('scene').addEventListener('wheel',e=>{e.preventDefault();dist=clamp(dist+e.deltaY*.012,3.5,25);sync()},{passive:false});window.addEventListener('keydown',e=>{if(e.target.matches('input,button'))return;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')angle=((angle-5+540)%360)-180;if(e.key==='ArrowRight')angle=((angle+5+540)%360)-180;if(e.key==='ArrowUp')dist=clamp(dist-.5,3.5,25);if(e.key==='ArrowDown')dist=clamp(dist+.5,3.5,25);if(e.key===' ')playing=!playing;sync()});
function loop(t){let dt=last?Math.min(.1,(t-last)/1000):0;last=t;if(playing&&!staticMode)phase=(phase+dt*15*speed)%frames.length;if(orbit){angle=((angle+dt*25+540)%360)-180;sync()}draw($('scene'),angle*rad,dist,eye);if(mirror)draw($('mirror'),(angle+115)*rad,Math.max(8,dist+3),3.15,true);requestAnimationFrame(loop)}
Promise.allSettled([...frames,original].map(im=>im.decode())).then(()=>{$('loading').hidden=true;sync();requestAnimationFrame(loop)});sync();
</script></body></html>
